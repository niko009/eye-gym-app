name: Deploy production

on:
  push:
    branches:
      - 001-eye-gym-web-app
  workflow_dispatch:

concurrency:
  group: eye-gym-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish static site
        run: |
          set -euo pipefail
          TARGET=/srv/bacus/apps/eye-gym/site
          mkdir -p "$TARGET"
          rm -rf "$TARGET"/*
          cp -a dist/. "$TARGET"/
          test -f "$TARGET/index.html"

      - name: Verify Docker for API deployment
        run: |
          set -euo pipefail
          command -v docker >/dev/null
          docker compose version

      - name: Bootstrap production API secrets
        run: |
          set -euo pipefail
          ENV_FILE=/srv/bacus/apps/eye-gym/.env
          if [ ! -f "$ENV_FILE" ]; then
            umask 077
            POSTGRES_PASSWORD="$(openssl rand -hex 32)"
            SESSION_SECRET="$(openssl rand -hex 48)"
            cat > "$ENV_FILE" <<EOF
          APP_DOMAIN=eye-gym.bacus.dev
          POSTGRES_USER=eyegym
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          POSTGRES_DB=eyegym
          SESSION_SECRET=$SESSION_SECRET
          GOOGLE_CLIENT_ID=
          GOOGLE_CLIENT_SECRET=
          TELEGRAM_BOT_TOKEN=
          TELEGRAM_INIT_DATA_MAX_AGE_SECONDS=3600
          VAPID_PUBLIC_KEY=
          VAPID_PRIVATE_KEY=
          VAPID_SUBJECT=mailto:nikomisha@gmail.com
          BACKUP_RETENTION_DAYS=14
          EOF
          fi
          chmod 600 "$ENV_FILE"
          test -s "$ENV_FILE"

      - name: Detect reverse proxy configuration
        id: reverse_proxy
        run: |
          set -euo pipefail
          KIND=none
          if systemctl is-active --quiet nginx 2>/dev/null || pgrep -x nginx >/dev/null 2>&1; then
            KIND=nginx
          elif systemctl is-active --quiet caddy 2>/dev/null || pgrep -x caddy >/dev/null 2>&1; then
            KIND=caddy
          elif systemctl is-active --quiet apache2 2>/dev/null || pgrep -x apache2 >/dev/null 2>&1; then
            KIND=apache
          elif docker ps --format '{{.Image}} {{.Names}}' | grep -qi traefik; then
            KIND=traefik
          fi
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          test "$KIND" != none

      - name: Reverse proxy is Nginx
        if: steps.reverse_proxy.outputs.kind == 'nginx'
        run: 'true'

      - name: Reverse proxy is Caddy
        if: steps.reverse_proxy.outputs.kind == 'caddy'
        run: 'true'

      - name: Reverse proxy is Apache
        if: steps.reverse_proxy.outputs.kind == 'apache'
        run: 'true'

      - name: Reverse proxy is Traefik
        if: steps.reverse_proxy.outputs.kind == 'traefik'
        run: 'true'

      - name: Stage API runtime
        run: |
          set -euo pipefail
          RUNTIME=/srv/bacus/apps/eye-gym/runtime
          mkdir -p "$RUNTIME"
          find "$RUNTIME" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=server/node_modules \
            --exclude=dist \
            --exclude=server/dist \
            --exclude=.playwright-cli \
            --exclude=output \
            -cf - . | tar -xf - -C "$RUNTIME"

      - name: Deploy API, worker and database
        run: |
          set -euo pipefail
          RUNTIME=/srv/bacus/apps/eye-gym/runtime
          ENV_FILE=/srv/bacus/apps/eye-gym/.env
          COMPOSE=(docker compose --env-file "$ENV_FILE" -f compose.yaml -f deploy/compose.host.yaml)
          cd "$RUNTIME"
          "${COMPOSE[@]}" build api worker migrate
          "${COMPOSE[@]}" up -d postgres
          "${COMPOSE[@]}" --profile tools run --rm migrate
          "${COMPOSE[@]}" up -d api worker backup

          for ATTEMPT in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          "${COMPOSE[@]}" ps
          exit 1

      - name: Detect Caddy runtime
        if: steps.reverse_proxy.outputs.kind == 'caddy'
        id: caddy_runtime
        run: |
          set -euo pipefail
          MODE=process
          if systemctl is-active --quiet caddy 2>/dev/null; then
            MODE=systemd
          elif docker ps --format '{{.Image}} {{.Names}}' | grep -qi caddy; then
            MODE=docker
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Caddy runs with systemd
        if: steps.caddy_runtime.outputs.mode == 'systemd'
        run: 'true'

      - name: Caddy runs in Docker
        if: steps.caddy_runtime.outputs.mode == 'docker'
        run: 'true'

      - name: Caddy runs as a standalone process
        if: steps.caddy_runtime.outputs.mode == 'process'
        run: 'true'

      - name: Configure systemd Caddy
        if: steps.caddy_runtime.outputs.mode == 'systemd'
        run: |
          set -euo pipefail
          DOMAIN=eye-gym.bacus.dev
          CONFIG="$(sudo systemctl cat caddy | sed -nE 's/.*--config[= ]+([^ ]+).*/\1/p' | tail -n 1)"
          CONFIG="${CONFIG:-/etc/caddy/Caddyfile}"
          test -f "$CONFIG"
          BACKUP="${CONFIG}.eye-gym-backup"
          sudo cp "$CONFIG" "$BACKUP"
          sudo python3 /srv/bacus/apps/eye-gym/runtime/scripts/configure_caddy_api.py "$CONFIG" "$DOMAIN" 127.0.0.1:18080
          if ! sudo caddy validate --config "$CONFIG" --adapter caddyfile; then
            sudo cp "$BACKUP" "$CONFIG"
            exit 1
          fi
          if ! sudo systemctl reload caddy; then
            sudo cp "$BACKUP" "$CONFIG"
            sudo systemctl reload caddy
            exit 1
          fi
          sudo rm -f "$BACKUP"

      - name: Locate Docker Caddy configuration
        if: steps.caddy_runtime.outputs.mode == 'docker'
        id: docker_caddy
        run: |
          set -euo pipefail
          CONTAINER="$(docker ps --format '{{.ID}} {{.Image}} {{.Names}}' | awk 'tolower($0) ~ /caddy/ {print $1; exit}')"
          test -n "$CONTAINER"
          RUNTIME="$(docker inspect --format '{{.Config.Image}} {{json .Config.Cmd}}' "$CONTAINER")"
          FLAVOR=file
          if printf '%s' "$RUNTIME" | grep -qi 'docker-proxy'; then
            FLAVOR=docker-proxy
          fi
          CONFIG_SOURCE="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/etc/caddy/Caddyfile"}}{{.Source}}{{end}}{{end}}' "$CONTAINER")"
          if [ -z "$CONFIG_SOURCE" ]; then
            CONFIG_DIR="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/etc/caddy"}}{{.Source}}{{end}}{{end}}' "$CONTAINER")"
            if [ -n "$CONFIG_DIR" ]; then
              CONFIG_SOURCE="${CONFIG_DIR}/Caddyfile"
            fi
          fi
          if [ -z "$CONFIG_SOURCE" ]; then
            FLAVOR=docker-proxy
          fi
          if [ "$FLAVOR" = file ]; then
            sudo test -f "$CONFIG_SOURCE"
          fi
          echo "container=$CONTAINER" >> "$GITHUB_OUTPUT"
          echo "config_source=$CONFIG_SOURCE" >> "$GITHUB_OUTPUT"
          echo "flavor=$FLAVOR" >> "$GITHUB_OUTPUT"

      - name: Patch Docker Caddy configuration
        if: steps.docker_caddy.outputs.flavor == 'file'
        run: |
          set -euo pipefail
          CONFIG_SOURCE='${{ steps.docker_caddy.outputs.config_source }}'
          BACKUP="${CONFIG_SOURCE}.eye-gym-backup"
          sudo cp "$CONFIG_SOURCE" "$BACKUP"
          sudo python3 /srv/bacus/apps/eye-gym/runtime/scripts/configure_caddy_api.py "$CONFIG_SOURCE" eye-gym.bacus.dev api:8080

      - name: Connect Docker Caddy to API network
        if: steps.caddy_runtime.outputs.mode == 'docker'
        run: |
          set -euo pipefail
          CADDY_CONTAINER='${{ steps.docker_caddy.outputs.container }}'
          API_CONTAINER="$(docker ps --filter label=com.docker.compose.project=eye-gym --filter label=com.docker.compose.service=api --format '{{.ID}}' | head -n 1)"
          test -n "$API_CONTAINER"
          while read -r NETWORK; do
            [ -n "$NETWORK" ] || continue
            docker network connect "$NETWORK" "$API_CONTAINER" 2>/dev/null || true
          done < <(docker inspect --format '{{range $name, $_ := .NetworkSettings.Networks}}{{println $name}}{{end}}' "$CADDY_CONTAINER")
          docker network connect eye-gym_default "$CADDY_CONTAINER" 2>/dev/null || true

      - name: Validate and reload Docker Caddy
        if: steps.docker_caddy.outputs.flavor == 'file'
        run: |
          set -euo pipefail
          CONTAINER='${{ steps.docker_caddy.outputs.container }}'
          CONFIG_SOURCE='${{ steps.docker_caddy.outputs.config_source }}'
          BACKUP="${CONFIG_SOURCE}.eye-gym-backup"
          if ! docker exec "$CONTAINER" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile; then
            sudo cp "$BACKUP" "$CONFIG_SOURCE"
            exit 1
          fi
          if ! docker exec "$CONTAINER" caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile; then
            sudo cp "$BACKUP" "$CONFIG_SOURCE"
            docker exec "$CONTAINER" caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
            exit 1
          fi
          sudo rm -f "$BACKUP"

      - name: Configure standalone Caddy
        if: steps.caddy_runtime.outputs.mode == 'process'
        run: |
          set -euo pipefail
          DOMAIN=eye-gym.bacus.dev
          PID="$(pgrep -x caddy | head -n 1)"
          ARGS="$(tr '\0' ' ' < "/proc/$PID/cmdline")"
          CONFIG="$(printf '%s\n' "$ARGS" | sed -nE 's/.*--config[= ]+([^ ]+).*/\1/p')"
          test -n "$CONFIG"
          BACKUP="${CONFIG}.eye-gym-backup"
          cp "$CONFIG" "$BACKUP"
          python3 /srv/bacus/apps/eye-gym/runtime/scripts/configure_caddy_api.py "$CONFIG" "$DOMAIN" 127.0.0.1:18080
          if ! caddy validate --config "$CONFIG" --adapter caddyfile; then
            cp "$BACKUP" "$CONFIG"
            exit 1
          fi
          if ! caddy reload --config "$CONFIG" --adapter caddyfile; then
            cp "$BACKUP" "$CONFIG"
            caddy reload --config "$CONFIG" --adapter caddyfile
            exit 1
          fi
          rm -f "$BACKUP"

      - name: Verify public API
        run: |
          set -euo pipefail
          for ATTEMPT in $(seq 1 20); do
            if curl --fail --silent https://eye-gym.bacus.dev/api/health >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Deployment summary
        run: echo "Eye Gym web and public API deployed successfully"
