name: Deploy production

on:
  push:
    branches:
      - 001-eye-gym-web-app
  workflow_dispatch:

concurrency:
  group: eye-gym-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish static site
        run: |
          set -euo pipefail
          TARGET=/srv/bacus/apps/eye-gym/site
          mkdir -p "$TARGET"
          rm -rf "$TARGET"/*
          cp -a dist/. "$TARGET"/
          test -f "$TARGET/index.html"

      - name: Deployment summary
        run: echo "Eye Gym deployed to /srv/bacus/apps/eye-gym/site"
