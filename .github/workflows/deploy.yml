name: Deploy production

on:
  push:
    branches:
      - 001-eye-gym-web-app
  workflow_dispatch:

concurrency:
  group: eye-gym-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish static site
        run: |
          set -euo pipefail
          TARGET=/srv/bacus/apps/eye-gym/site
          mkdir -p "$TARGET"
          rm -rf "$TARGET"/*
          cp -a dist/. "$TARGET"/
          test -f "$TARGET/index.html"

      - name: Inspect API deployment prerequisites
        run: |
          set -euo pipefail
          if command -v docker >/dev/null 2>&1; then
            echo "docker=available"
            docker compose version || true
          else
            echo "docker=missing"
          fi

          if [ -f /srv/bacus/apps/eye-gym/.env ]; then
            echo "production_env=present"
          else
            echo "production_env=missing"
          fi

          if sudo -n true 2>/dev/null; then
            echo "noninteractive_sudo=available"
          else
            echo "noninteractive_sudo=unavailable"
          fi

          echo "static_site_proxy_configs:"
          for CONFIG_ROOT in /etc/nginx/sites-enabled /etc/nginx/conf.d /etc/caddy; do
            if [ -r "$CONFIG_ROOT" ]; then
              grep -RIlF '/srv/bacus/apps/eye-gym/site' "$CONFIG_ROOT" 2>/dev/null || true
            fi
          done

      - name: Deployment summary
        run: echo "Eye Gym deployed to /srv/bacus/apps/eye-gym/site"
