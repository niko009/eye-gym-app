<body>
    <!-- Main App Container -->
    <div id="app">
        <!-- Exercise List Screen (default view) -->
        <div id="exercise-list-screen">
            <header>
                <h1 id="app-title">Eye Gym</h1>
                <button id="settings-button" class="icon-button" aria-label="Settings">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M12 1v6m0 6v6m5.3-13.3l-3.2 3.2m-4.2 4.2l-3.2 3.2m12.7-3.2l-3.2-3.2m-4.2-4.2l-3.2-3.2"></path>
                    </svg>
                </button>
            </header>
            
            <div id="exercise-list" class="exercise-list">
                <!-- Exercise cards will be dynamically inserted here -->
            </div>
        </div>
        
        <!-- Exercise Session Screen (hidden by default) -->
        <div id="session-screen" style="display: none;">
            <!-- Session content will be dynamically inserted here -->
        </div>
        
        <!-- Settings Screen (hidden by default) -->
        <div id="settings-screen" style="display: none;">
            <!-- Settings content will be dynamically inserted here -->
        </div>
    </div>
    
    <!-- App JavaScript Modules -->
    <script type="module" src="js/app.js"></script>
</body>
