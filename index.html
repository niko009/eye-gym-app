<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#083f3b" />
    <meta name="description" content="Короткие комплексы упражнений для расслабления глаз." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Eye Gym — упражнения для глаз</title>
    <script>
      (() => {
        const saved = localStorage.getItem('eye_gym_theme') || 'system';
        const dark = saved === 'dark' || (saved === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
